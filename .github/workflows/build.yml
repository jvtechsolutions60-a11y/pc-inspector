name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publier l'exécutable
        run: dotnet publish src/PcInspector/PcInspector.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PcInspector
          path: publish/PcInspector.exe
