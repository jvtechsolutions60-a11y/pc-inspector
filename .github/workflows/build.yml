name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler l'exécutable
        run: dotnet build src/PcInspector/PcInspector.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PcInspector
          path: publish/PcInspector.exe
