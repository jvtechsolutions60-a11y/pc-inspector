name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Droits minimaux (audit M04) : lecture seule partout, écriture seulement pour publier la version sur main.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Le numéro de run sert de version commune aux .exe : v1.0.N, affichée dans les logiciels et les rapports.
      VERSION: 1.0.${{ github.run_number }}
      WIN11DEBLOAT: 2026.08.24
      # Empreinte des scripts de cette version (calcul : étape « Préparer le serveur PXE »). Contrôlée au téléchargement
      # et inscrite dans PC Maintenance, qui refuse de lancer des scripts différents. À changer avec WIN11DEBLOAT.
      WIN11DEBLOAT_COMMIT: f431c56159bfd0b68822c583509126bab8cb94cc
      WIN11DEBLOAT_SHA256: 3bacb5953738abe54cf764fb0e618431e485f09ebc5f775e4b957925e3366f2b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # SDK figé par global.json (8.0.x) : même compilateur à chaque compilation.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Version du SDK
        run: dotnet --version

      # Tests automatisés : données simulées uniquement, rien n'est lu ni modifié sur la machine de compilation.
      # Un test en échec arrête la compilation : aucun .exe n'est produit.
      - name: Tests automatisés
        run: dotnet test tests/JvtechTests/JvtechTests.csproj -c Release --logger "console;verbosity=normal" --logger "trx;LogFileName=tests.trx" --results-directory publish/tests

      - name: Compiler PC Inspector
        run: dotnet build src/PcInspector/PcInspector.csproj -c Release -o publish/inspector -p:Version=${{ env.VERSION }}

      - name: Compiler PC Sécurité
        run: dotnet build src/PcSecurite/PcSecurite.csproj -c Release -o publish/securite -p:Version=${{ env.VERSION }}

      - name: Compiler PC Maintenance
        run: dotnet build src/PcMaintenance/PcMaintenance.csproj -c Release -o publish/maintenance -p:Version=${{ env.VERSION }} -p:Win11DebloatSha256=${{ env.WIN11DEBLOAT_SHA256 }}

      - name: Compiler PC Migration
        run: dotnet build src/PcMigration/PcMigration.csproj -c Release -o publish/migration -p:Version=${{ env.VERSION }}

      - name: Compiler le lanceur JVTECH Outils
        run: dotnet build src/JvtechOutils/JvtechOutils.csproj -c Release -o publish/lanceur -p:Version=${{ env.VERSION }}

      # JVTECH Sonde : le .exe, son sonde.ini d'exemple et le module optionnel « capteurs » (LibreHardwareMonitor).
      - name: Compiler JVTECH Sonde
        run: dotnet build src/JvtechSonde/JvtechSonde.csproj -c Release -o publish/sonde-build -p:Version=${{ env.VERSION }}

      - name: Compiler le module capteurs de JVTECH Sonde
        run: dotnet build src/JvtechSonde.Capteurs/JvtechSonde.Capteurs.csproj -c Release -o publish/sonde-capteurs -p:Version=${{ env.VERSION }}

      - name: Compiler JVTECH Serveur PXE
        run: dotnet build src/JvtechServeur/JvtechServeur.csproj -c Release -o publish/serveur-build -p:Version=${{ env.VERSION }}

      # Signature Authenticode (Azure Artifact Signing) des .exe JVTECH, avant les .zip et les empreintes.
      # Inactive tant que la variable du dépôt AZURE_SIGNING_ACCOUNT n'existe pas : voir docs/signature-et-distribution.md.
      # Seuls les fichiers JVTECH sont signés, pas les DLL de LibreHardwareMonitor (code d'un autre éditeur).
      - name: Signer les .exe (Azure Artifact Signing)
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\publish\inspector\PcInspector.exe
            ${{ github.workspace }}\publish\securite\PcSecurite.exe
            ${{ github.workspace }}\publish\maintenance\PcMaintenance.exe
            ${{ github.workspace }}\publish\migration\PcMigration.exe
            ${{ github.workspace }}\publish\lanceur\JvtechOutils.exe
            ${{ github.workspace }}\publish\serveur-build\JvtechServeur.exe
            ${{ github.workspace }}\publish\sonde-build\JvtechSonde.exe
            ${{ github.workspace }}\publish\sonde-capteurs\JvtechSonde.Capteurs.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: JVTECH Solutions
          description-url: https://github.com/jvtechsolutions60-a11y/pc-inspector

      - name: Vérifier les signatures
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = 'inspector/PcInspector.exe','securite/PcSecurite.exe','maintenance/PcMaintenance.exe','migration/PcMigration.exe',
                   'lanceur/JvtechOutils.exe','serveur-build/JvtechServeur.exe','sonde-build/JvtechSonde.exe','sonde-capteurs/JvtechSonde.Capteurs.dll'
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature "publish/$f"
            "{0} : {1} ({2})" -f $f, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { $bad += $f }
          }
          if ($bad.Count -gt 0) { throw "Signature invalide : $($bad -join ', ')" }

      - name: Réunir les .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/outils | Out-Null
          Copy-Item publish/inspector/PcInspector.exe, publish/securite/PcSecurite.exe, publish/maintenance/PcMaintenance.exe, publish/migration/PcMigration.exe, publish/lanceur/JvtechOutils.exe publish/outils/
          Compress-Archive -Path publish/outils/* -DestinationPath publish/JVTECH-Outils-v${{ env.VERSION }}.zip

      # Sonde à installer sur les PC sous contrat : JvtechSonde.exe + sonde.ini + capteurs\ (DLL seulement).
      - name: Préparer JVTECH Sonde
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/sonde/capteurs | Out-Null
          Copy-Item publish/sonde-build/JvtechSonde.exe, publish/sonde-build/sonde.ini, docs/sonde.md -Destination publish/sonde/
          Copy-Item publish/sonde-capteurs/*.dll -Destination publish/sonde/capteurs/
          if (-not (Test-Path publish/sonde/capteurs/LibreHardwareMonitorLib.dll)) { throw 'LibreHardwareMonitorLib.dll introuvable' }
          Compress-Archive -Path publish/sonde/* -DestinationPath publish/JVTECH-Sonde-v${{ env.VERSION }}.zip

      # Serveur PXE du mini PC de l'atelier : le serveur, et à côté le kit qu'il ajoute à l'installation de Windows
      # (autounattend.xml, PC Maintenance et ses réglages, recopiés par Windows dans C:\JVTECH).
      - name: Préparer le serveur PXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/serveur/Kit/JVTECH | Out-Null
          Copy-Item publish/serveur-build/JvtechServeur.exe, deploy/LISEZMOI.txt publish/serveur/
          Copy-Item deploy/autounattend.xml publish/serveur/Kit/
          Copy-Item publish/maintenance/PcMaintenance.exe, deploy/options.ini, deploy/debloat.ini -Destination publish/serveur/Kit/JVTECH
          # Win11Debloat (MIT), version figée : changer WIN11DEBLOAT pour passer à une version plus récente.
          $tag = '${{ env.WIN11DEBLOAT }}'
          # Téléchargé par son commit (immuable, une étiquette peut être déplacée), puis contrôlé par empreinte.
          $commit = '${{ env.WIN11DEBLOAT_COMMIT }}'
          Invoke-WebRequest "https://github.com/Raphire/Win11Debloat/archive/$commit.zip" -OutFile publish/win11debloat.zip
          Expand-Archive publish/win11debloat.zip publish/win11debloat
          Copy-Item "publish/win11debloat/Win11Debloat-$commit" -Destination publish/serveur/Kit/JVTECH/Win11Debloat -Recurse
          if (-not (Test-Path publish/serveur/Kit/JVTECH/Win11Debloat/Win11Debloat.ps1)) { throw 'Win11Debloat.ps1 introuvable' }
          # Empreinte des scripts (même calcul que Win11Debloat.FolderHash dans PC Maintenance).
          $root = (Resolve-Path publish/serveur/Kit/JVTECH/Win11Debloat).Path.TrimEnd('\')
          $ext = '.ps1','.psm1','.psd1','.reg','.bat','.cmd','.vbs','.exe','.dll'
          [string[]]$lines = Get-ChildItem $root -Recurse -File -Force | Where-Object { $ext -contains $_.Extension.ToLowerInvariant() } | ForEach-Object {
            $_.FullName.Substring($root.Length + 1).Replace('\', '/') + '|' + (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          [Array]::Sort($lines, [StringComparer]::Ordinal)
          $sha = [Security.Cryptography.SHA256]::Create()
          $hash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($lines -join "`n"))).Replace('-', '').ToLowerInvariant()
          Write-Host "Empreinte des scripts Win11Debloat $tag : $hash"
          if ($hash -ne '${{ env.WIN11DEBLOAT_SHA256 }}') { throw "Win11Debloat $tag : empreinte $hash différente de celle attendue (WIN11DEBLOAT_SHA256). Vérifier les changements avant de mettre à jour." }
          Compress-Archive -Path publish/serveur/* -DestinationPath publish/JVTECH-Serveur-PXE-v${{ env.VERSION }}.zip

      # Empreintes SHA-256 : permettent de vérifier qu'un téléchargement est complet et n'a pas été modifié
      # (Get-FileHash fichier -Algorithm SHA256, à comparer avec la ligne du fichier).
      - name: Empreintes SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish/*.zip) + @(Get-ChildItem publish/outils/*.exe) + @(Get-Item publish/sonde/JvtechSonde.exe)
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          Set-Content -Path publish/SHA256SUMS.txt -Value $lines -Encoding utf8NoBOM
          Copy-Item publish/SHA256SUMS.txt publish/outils/
          Get-Content publish/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JVTECH-Outils-v${{ env.VERSION }}
          path: |
            publish/outils/*.exe
            publish/outils/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JVTECH-Sonde-v${{ env.VERSION }}
          path: publish/sonde/

      - uses: actions/upload-artifact@v4
        with:
          name: JVTECH-Serveur-PXE-v${{ env.VERSION }}
          path: publish/serveur/

      # Sur main : les fichiers à publier passent au travail « release », seul à pouvoir écrire dans le dépôt.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: publication
          path: |
            publish/JVTECH-Outils-v${{ env.VERSION }}.zip
            publish/JVTECH-Serveur-PXE-v${{ env.VERSION }}.zip
            publish/outils/*.exe
            publish/SHA256SUMS.txt

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # attestation de provenance (Sigstore), audit I10
      attestations: write
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publication
          path: publish

      # Attestation de provenance signée (gratuite, Sigstore) : prouve que chaque fichier vient de cette compilation
      # de ce dépôt. Vérification : gh attestation verify PcMaintenance.exe -R jvtechsolutions60-a11y/pc-inspector
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            publish/JVTECH-Outils-v${{ env.VERSION }}.zip
            publish/JVTECH-Serveur-PXE-v${{ env.VERSION }}.zip
            publish/outils/*.exe

      # Une version publiée par compilation, que les logiciels consultent pour signaler une mise à jour.
      - name: Publier la version
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: JVTECH Outils v${{ env.VERSION }}
          body: |
            PC Inspector, PC Sécurité, PC Maintenance, PC Migration et le lanceur JVTECH Outils, version v${{ env.VERSION }}.
            Télécharger le .zip, le décompresser (sur une clé USB pour le mode clé USB) et lancer JvtechOutils.exe.
            Contrôle quotidien des PC sous contrat : JVTECH-Sonde (voir sonde.md dans le .zip).
            Préparation revente par le réseau (PXE) : JVTECH-Serveur-PXE, à installer sur le mini PC de l'atelier (voir LISEZMOI.txt).
            Vérifier les fichiers avec SHA256SUMS.txt (voir docs/verification-telechargement.md).
          files: |
            publish/JVTECH-Outils-v${{ env.VERSION }}.zip
            publish/JVTECH-Serveur-PXE-v${{ env.VERSION }}.zip
            publish/JVTECH-Sonde-v${{ env.VERSION }}.zip
            publish/outils/*.exe
            publish/SHA256SUMS.txt
