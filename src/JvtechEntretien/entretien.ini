; JVTECH Entretien : réglages de ce PC (entretien automatique à chaque ouverture de session).
; Une ligne « clé = valeur ». Les lignes qui commencent par ; sont des commentaires.
; À l'installation, ce fichier est copié dans C:\Program Files\JVTECH\Entretien et rendu illisible pour
; les utilisateurs du PC (il contient le mot de passe du NAS).

; Code du client (pas son nom : aucun renseignement personnel dans le rapport). Exemple : C042
client =

; Nom du poste dans le rapport et le tableau (par défaut : le nom Windows du PC).
poste =

; Dossier partagé du NAS du client. À chaque ouverture de session, le PC y dépose son rapport
; et ajoute une ligne au tableau de suivi suivi-entretien.csv (s'ouvre dans Excel).
; Exemple : \\NAS\JVTECH\Entretien   ou   \\192.168.1.10\JVTECH\Entretien
dossier_partage =

; Compte du NAS autorisé à écrire dans ce dossier (la maintenance tourne en compte SYSTEM, que le NAS ne
; connaît pas). Laisser vide seulement si le partage est ouvert en écriture à tous.
partage_utilisateur =
partage_mot_de_passe =

; Logiciels mis à jour (identifiants winget, séparés par ;). Les autres ne sont jamais touchés.
; Laisser vide pour garder la liste sûre par défaut (navigateurs, lecteurs PDF, 7-Zip, VLC, LibreOffice…).
logiciels =

; Pourcentage d'espace libre du disque système en dessous duquel le rapport le signale.
disque_libre_alerte = 15
