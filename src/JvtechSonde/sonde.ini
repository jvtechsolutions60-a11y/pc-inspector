; JVTECH Sonde : réglages de ce PC.
; Une ligne « clé = valeur ». Les lignes qui commencent par ; sont des commentaires.
; Une valeur absente garde la valeur par défaut indiquée en commentaire.

; Nom du client, repris dans les résultats.
client =

; Nom du poste (par défaut : le nom Windows du PC).
poste =

; Adresse du moniteur « Push » créé dans Uptime Kuma pour ce PC (un moniteur par PC).
; Exemple : https://kuma.exemple.fr/api/push/AbCdEf1234
; Les paramètres d'exemple donnés par Kuma (?status=up&msg=OK&ping=) peuvent rester : la sonde les remplace.
; Vide : la sonde mesure sans rien envoyer.
kuma_push =

; oui : un point orange met aussi le moniteur en panne dans Kuma. non (défaut) : seulement les points rouges.
; Dans les deux cas, le message envoyé à Kuma liste les points orange et rouges.
alerte_orange = non

; ---------- Seuils (orange = à surveiller, rouge = intervention) ----------

; Remplissage de chaque disque, en %.
disque_orange = 85
disque_rouge = 95

; Mémoire utilisée au moment du contrôle, en %.
ram_orange = 90
ram_rouge = 97

; Utilisation moyenne du processeur pendant la mesure, en % (orange seulement).
cpu_orange = 90
cpu_mesure_secondes = 30

; Températures, en °C.
cpu_temp_orange = 85
cpu_temp_rouge = 95
gpu_temp_orange = 85
gpu_temp_rouge = 95

; Usure de la batterie des portables, en % de la capacité d'origine perdue.
batterie_usure_orange = 40
batterie_usure_rouge = 60

; Windows Update : orange si la dernière recherche réussie date de plus de N jours, rouge au-delà de 3 × N.
recherche_maj_jours = 7

; Écrans bleus et arrêts brutaux sur les 30 derniers jours.
plantages_orange = 1
plantages_rouge = 3
