# Préparation revente : 1 = oui, 0 = non. Ce fichier est à côté de PcMaintenance.exe (C:\JVTECH sur le PC préparé).

# Retirer les applications préinstallées inutiles (liste dans debloat.ini)
Debloat = 1

# Win11Debloat (github.com/Raphire/Win11Debloat), fourni avec le kit : applications, Copilot, Recall, Bing,
# widgets, suggestions et télémétrie, pour le compte de l'acheteur. Windows Update, Defender, Store et Edge ne sont pas touchés.
Win11Debloat = 1

# Couper pour l'acheteur : publicités et suggestions du menu Démarrer, applications installées toutes seules,
# Bing dans la recherche, widgets, identifiant publicitaire
Publicites = 1

# Pilotes, firmwares et logiciels du constructeur : Dell Command Update, Lenovo System Update, HP Image Assistant
Constructeur = 1

# Mettre aussi à jour le BIOS par l'outil du constructeur (jamais sur batterie)
Bios = 1

# Nombre maximal de passages de Windows Update (chacun suivi d'un redémarrage)
PassagesMax = 8

# À la fin : remettre le PC au premier démarrage (l'acheteur choisit sa langue et crée son compte) et l'éteindre.
# 0 = rester en mode audit pour vérifier à la main avant de lancer Sysprep soi-même.
PremierDemarrage = 1
